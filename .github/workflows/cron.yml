# ==========================================
# Version: 1.6.0
# Date: 2026-09-17
# Summary: 16時の懐かしい女優枠を残し、22時と24時も維持
# ==========================================
name: FANZA Auto Affiliate Cron

on:
  schedule:
    # JST 08:00 = UTC 23:00 セール
    - cron: "0 23 * * *"
    # JST 12:00 = UTC 03:00 売上順
    - cron: "0 3 * * *"
    # JST 16:00 = UTC 07:00 懐かしい女優（追加枠）
    - cron: "0 7 * * *"
    # JST 19:00 = UTC 10:00 女優イベント（1週間前・前日・直前）
    - cron: "0 10 * * *"
    # JST 20:00 = UTC 11:00 セール
    - cron: "0 11 * * *"
    # JST 22:00 = UTC 13:00 懐かしい女優（追加枠）
    - cron: "0 13 * * *"
    # JST 24:00 = UTC 15:00 売上順
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード (sale / rank / nostalgic / live-event)"
        required: false
        default: sale
        type: choice
        options:
          - sale
          - rank
          - nostalgic
          - live-event

permissions:
  contents: write

jobs:
  run-affiliate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve run mode from schedule
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%H)
          case "$HOUR" in
            23) echo "value=sale" >> "$GITHUB_OUTPUT" ;;
            03) echo "value=rank" >> "$GITHUB_OUTPUT" ;;
            07) echo "value=nostalgic" >> "$GITHUB_OUTPUT" ;;
            10) echo "value=live-event" >> "$GITHUB_OUTPUT" ;;
            11) echo "value=sale" >> "$GITHUB_OUTPUT" ;;
            13) echo "value=nostalgic" >> "$GITHUB_OUTPUT" ;;
            15) echo "value=rank" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=sale" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run main.py
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          MODE="${{ steps.mode.outputs.value }}"
          if [ "$MODE" = "live-event" ]; then
            python main.py --live-event
          else
            python main.py --mode "$MODE"
          fi

      - name: Commit and push docs and posted.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ posted.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub Pages articles and posted history"
          git push
