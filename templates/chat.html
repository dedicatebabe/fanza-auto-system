<!--
Version: 1.3.0
Date: 2026-09-16
Summary: メニュー表記をライブチャットにする
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAGE_TITLE}} | 夜のリブレ</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #12151c;
      --bg-mid: #1a1f2b;
      --panel: rgba(255, 255, 255, 0.04);
      --text: #f3f1ec;
      --muted: #a8a59c;
      --line: rgba(243, 241, 236, 0.12);
      --gold: #d4b483;
      --ink: #0b0d12;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Instrument Sans", "Hiragino Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 45% at 80% -5%, rgba(212, 180, 131, 0.16), transparent 55%),
        radial-gradient(ellipse 50% 35% at 0% 20%, rgba(88, 110, 160, 0.18), transparent 50%),
        linear-gradient(165deg, var(--bg-deep), var(--bg-mid) 55%, #10131a);
      line-height: 1.85;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 0;
    }
    a { color: inherit; text-decoration: none; }
    .site-header, .main, .site-footer { position: relative; z-index: 1; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 21, 28, 0.78);
      backdrop-filter: blur(16px);
    }
    .header-inner, .main, .footer-inner {
      width: min(860px, calc(100% - 2rem));
      margin: 0 auto;
    }
    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #2a2430, #12151c);
      border: 1px solid rgba(212, 180, 131, 0.35);
      color: var(--gold);
      font-family: "Shippori Mincho", serif;
      font-weight: 700;
    }
    .brand strong {
      display: block;
      font-family: "Shippori Mincho", serif;
      font-size: 1.12rem;
      font-weight: 600;
    }
    .brand span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
    }
    .site-nav {
      display: flex;
      align-items: center;
      gap: 1.15rem;
    }
    .nav-link {
      color: var(--muted);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
    }
    .nav-link:hover,
    .nav-link.is-current { color: var(--gold); }
    .nav-chat {
      padding: 0.38rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(212, 180, 131, 0.45);
      background: rgba(212, 180, 131, 0.14);
      color: var(--gold);
    }
    .nav-chat:hover,
    .nav-chat.is-current {
      background: rgba(212, 180, 131, 0.22);
      color: var(--gold);
    }
    .main { padding: 2.2rem 0 5rem; }
    .hero {
      margin-bottom: 1.8rem;
      padding: 2rem 1.6rem;
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(212, 180, 131, 0.08), transparent 42%),
        var(--panel);
      box-shadow: var(--shadow);
    }
    .hero .eyebrow {
      margin: 0 0 0.55rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.16em;
    }
    .hero h1 {
      margin: 0 0 0.7rem;
      font-family: "Shippori Mincho", serif;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 600;
      line-height: 1.35;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }
    .chat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
      justify-items: center;
    }
    .chat-banner {
      width: 300px;
      max-width: 100%;
      height: 250px;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #0b0d12;
    }
    .chat-banner iframe {
      display: block;
      width: 300px;
      height: 250px;
      border: 0;
    }
    .empty {
      grid-column: 1 / -1;
      padding: 2.4rem 1.2rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    .back {
      display: inline-block;
      margin-top: 1.6rem;
      color: var(--gold);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }
    .site-footer {
      border-top: 1px solid var(--line);
      background: rgba(8, 10, 14, 0.55);
      padding: 2.2rem 0;
    }
    .footer-inner {
      display: grid;
      gap: 0.45rem;
      color: var(--muted);
      font-size: 0.84rem;
    }
    .footer-inner strong {
      color: var(--text);
      font-family: "Shippori Mincho", serif;
    }
    @media (max-width: 640px) {
      .hero { padding: 1.5rem 1.15rem; }
      .chat-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark">夜</div>
        <div>
          <strong>夜のリブレ</strong>
          <span>今夜の一本</span>
        </div>
      </a>
      <nav class="site-nav">
        <a class="nav-link" href="index.html">紹介</a>
        <a class="nav-link nav-chat is-current" href="chat.html">ライブチャット</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <p class="eyebrow">Live</p>
      <h1>今いるチャット</h1>
      <p>公式バナー。今チャット中の顔が出る。</p>
    </section>
    <div class="chat-grid">
      {{CHAT_CARDS}}
    </div>
    <a class="back" href="index.html">← 紹介へ</a>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <strong>夜のリブレ</strong>
      <div>このページにはアフィリエイト広告が含まれます。</div>
      <div>&copy; {{YEAR}} 夜のリブレ</div>
    </div>
  </footer>
</body>
</html>
